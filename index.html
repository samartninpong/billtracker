<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดบัญชีบิล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF9; --ink:#16181C; --ink-soft:#84898F;
    --accent:#3D6AF2; --accent-soft:#EEF2FE; --line:#EAEAE8;
    --paid:#1F9D6C; --paid-soft:#E7F6EF; --card-bg:#FFFFFF; --shadow:rgba(20,20,25,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111214; --ink:#EDEEEF; --ink-soft:#8B8F94;
      --accent:#7C9CFF; --accent-soft:#1B2036; --line:#25272A;
      --paid:#3FCB93; --paid-soft:#122820; --card-bg:#1A1B1E; --shadow:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#111214; --ink:#EDEEEF; --ink-soft:#8B8F94;
    --accent:#7C9CFF; --accent-soft:#1B2036; --line:#25272A;
    --paid:#3FCB93; --paid-soft:#122820; --card-bg:#1A1B1E; --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 100px;}
  .cover{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;padding:22px 20px;
    box-shadow:0 6px 20px var(--shadow);}
  .cover .month{font-weight:600;font-size:14px;color:var(--ink-soft);}
  .cover .total{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;
    margin-top:6px;line-height:1.05;letter-spacing:-.01em;}
  .cover .totallabel{font-size:13px;color:var(--ink-soft);margin-top:5px;}
  .cover .stats{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}
  .cover .stats b{font-family:'IBM Plex Mono',monospace;font-size:15px;display:block;color:var(--ink);font-weight:600;margin-top:2px;}
  .actions{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;border:none;border-radius:11px;padding:13px;font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.96);opacity:.85;}
  .btn-add{background:var(--accent);color:#fff;}
  .btn-close{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .group{margin-top:22px;}
  .group h2{font-size:14px;font-weight:600;color:var(--ink-soft);
    display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;}
  .group h2 span{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);}
  .card{background:var(--card-bg);border-radius:14px;border:1px solid var(--line);overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);
    transition:background-color .2s ease;}
  .row:last-child{border-bottom:none;}
  .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
    flex:none;cursor:pointer;position:relative;background:none;padding:0;
    transition:background-color .18s ease, border-color .18s ease, transform .18s ease;}
  .chk:active{transform:scale(.85);}
  .chk.on{background:var(--paid);border-color:var(--paid);}
  .chk.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:13px;}
  .rowmain{flex:1;min-width:0;transition:opacity .2s ease;}
  .row.ispaid .rowmain{opacity:.5;}
  .rowmain .name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);
    background:var(--accent-soft);padding:1px 7px;border-radius:20px;flex:none;}
  .rowmain .note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .amount{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
    text-align:right;flex:none;transition:opacity .2s ease;}
  .row.ispaid .amount{opacity:.5;}
  .edit{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;
    padding:4px 2px;flex:none;transition:opacity .15s ease;}
  .edit:active{opacity:.5;}
  .empty{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:14px;line-height:1.7;}
  .sheet-bg{position:fixed;inset:0;background:rgba(15,15,17,.4);display:flex;
    align-items:flex-end;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .sheet-bg.open{opacity:1;pointer-events:auto;}
  .sheet{background:var(--paper);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
  .sheet-bg.open .sheet{transform:translateY(0);}
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:600;}
  .field{margin-bottom:12px;}
  .field label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
    background:var(--card-bg);color:var(--ink);font-family:inherit;font-size:16px;
    transition:border-color .15s ease;}
  .field input:focus{outline:none;border-color:var(--accent);}
  .field.split{display:flex;gap:10px;}
  .field.split > div{flex:1;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px;}
  .chip{border:none;background:var(--accent-soft);color:var(--accent);font-family:inherit;
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;
    transition:transform .12s ease;}
  .chip:active{transform:scale(.94);}
  .chip.active{background:var(--accent);color:#fff;}
  .linkrow{display:flex;justify-content:center;gap:18px;margin-top:14px;}
  .linkbtn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;
    text-decoration:underline;font-family:inherit;cursor:pointer;padding:4px;}
  .backup-ta{width:100%;min-height:120px;border-radius:9px;border:1px solid var(--line);
    background:var(--card-bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;
    font-size:12px;padding:10px;margin-bottom:10px;}
  .sheet .actions{margin-top:16px;}
  .btn-save{background:var(--accent);color:#fff;}
  .btn-del{background:none;color:#D9483A;border:1px solid #D9483A;flex:none;padding:12px 16px;}
  .toast{position:fixed;left:16px;right:16px;bottom:18px;max-width:488px;margin:0 auto;
    background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:10px;font-size:13.5px;
    text-align:center;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;
    pointer-events:none;z-index:20;}
  .toast.show{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cover">
    <div class="month" id="monthLabel"></div>
    <div class="total" id="totalAmt">฿0.00</div>
    <div class="totallabel">ยอดรวมที่ต้องจ่ายเดือนนี้</div>
    <div class="stats">
      <div>จ่ายแล้ว<b id="paidCount">0/0</b></div>
      <div>คงเหลือ<b id="remainAmt">฿0.00</b></div>
    </div>
    <div class="actions">
      <button class="btn btn-add" id="btnAdd">+ เพิ่มรายการ</button>
      <button class="btn btn-close" id="btnClose">ปิดรอบเดือนนี้</button>
    </div>
    <div class="linkrow">
      <button class="linkbtn" id="btnBackup">สำรอง / กู้คืนข้อมูล</button>
    </div>
  </div>

  <div id="groups"></div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3 id="sheetTitle">เพิ่มรายการ</h3>
    <div class="field"><label>ชื่อรายการ</label><input id="fName" placeholder="เช่น ผ่อนแว่นตา"></div>
    <div class="field"><label>กลุ่ม / บัตร</label><input id="fGroup" list="groupList" placeholder="เช่น KTC"></div>
    <div class="chips" id="groupChips"></div>
    <datalist id="groupList"></datalist>
    <div class="field"><label>ยอดต่อเดือน (บาท)</label><input id="fAmount" type="number" inputmode="decimal" placeholder="0.00"></div>
    <div class="field split">
      <div><label>งวดปัจจุบัน (ถ้ามี)</label><input id="fCurrent" type="number" inputmode="numeric"></div>
      <div><label>งวดทั้งหมด (ถ้ามี)</label><input id="fTotal" type="number" inputmode="numeric"></div>
    </div>
    <div class="field"><label>โน้ต (ถ้ามี)</label><input id="fNote" placeholder="เช่น ครบกำหนดวันที่ 5"></div>
    <div class="actions">
      <button class="btn btn-del" id="btnDel" style="display:none">ลบ</button>
      <button class="btn btn-save" id="btnSave">บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-bg" id="backupBg">
  <div class="sheet">
    <h3>สำรอง / กู้คืนข้อมูล</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">คัดลอกข้อความนี้เก็บไว้ (เช่น ส่งให้ตัวเองใน Line) เผื่อข้อมูลหายจะได้วางกู้คืนได้</p>
    <textarea class="backup-ta" id="backupTa"></textarea>
    <div class="actions">
      <button class="btn btn-close" id="btnCopyBackup">คัดลอกข้อมูล</button>
      <button class="btn btn-save" id="btnRestoreBackup">กู้คืนจากข้อความนี้</button>
    </div>
  </div>
</div>

<script>
const KEY='passbook_items_v1';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');
let editId = null;
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function monthLabel(){
  const d=new Date();
  document.getElementById('monthLabel').textContent = thMonths[d.getMonth()]+' '+(d.getFullYear()+543);
}
function baht(n){ return '฿'+ (n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }

function render(){
  monthLabel();
  const total = items.reduce((s,i)=>s+Number(i.amount||0),0);
  const paidItems = items.filter(i=>i.paid);
  const remain = items.filter(i=>!i.paid).reduce((s,i)=>s+Number(i.amount||0),0);
  document.getElementById('totalAmt').textContent = baht(total);
  document.getElementById('remainAmt').textContent = baht(remain);
  document.getElementById('paidCount').textContent = paidItems.length+'/'+items.length;

  const groupsEl = document.getElementById('groups');
  if(items.length===0){
    groupsEl.innerHTML = '<div class="empty">ยังไม่มีรายการ<br>กด "+ เพิ่มรายการ" เพื่อเริ่มบันทึกบิลแรกของคุณ</div>';
    return;
  }
  const groups = {};
  items.forEach(i=>{ const g=i.group||'ทั่วไป'; (groups[g]=groups[g]||[]).push(i); });

  groupsEl.innerHTML = Object.keys(groups).map(g=>{
    const list = groups[g];
    const subtotal = list.reduce((s,i)=>s+Number(i.amount||0),0);
    const rows = list.map(i=>{
      const badge = (i.total) ? `<span class="badge">${i.current||0}/${i.total}</span>` : '';
      return `<div class="row ${i.paid?'ispaid':''}">
        <button class="chk ${i.paid?'on':''}" data-toggle="${i.id}" aria-label="จ่ายแล้ว"></button>
        <div class="rowmain">
          <div class="name">${escapeHtml(i.name)} ${badge}</div>
          ${i.note?`<div class="note">${escapeHtml(i.note)}</div>`:''}
        </div>
        <div class="amount">${baht(i.amount)}</div>
        <button class="edit" data-edit="${i.id}" aria-label="แก้ไข">✎</button>
      </div>`;
    }).join('');
    return `<div class="group"><h2>${escapeHtml(g)} <span>${baht(subtotal)}</span></h2><div class="card">${rows}</div></div>`;
  }).join('');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('groups').addEventListener('click', e=>{
  const t = e.target.closest('[data-toggle]');
  if(t){ const it=items.find(i=>i.id===t.dataset.toggle); it.paid=!it.paid; save(); render(); return; }
  const ed = e.target.closest('[data-edit]');
  if(ed){ openSheet(items.find(i=>i.id===ed.dataset.edit)); }
});

function refreshGroupList(){
  const set=[...new Set(items.map(i=>i.group).filter(Boolean))];
  document.getElementById('groupList').innerHTML = set.map(g=>`<option value="${escapeHtml(g)}">`).join('');
  const cur = document.getElementById('fGroup').value;
  document.getElementById('groupChips').innerHTML = set.map(g=>
    `<button type="button" class="chip ${g===cur?'active':''}" data-chip="${escapeHtml(g)}">${escapeHtml(g)}</button>`).join('');
}
document.getElementById('groupChips').addEventListener('click', e=>{
  const b = e.target.closest('[data-chip]');
  if(!b) return;
  document.getElementById('fGroup').value = b.dataset.chip;
  refreshGroupList();
});
function openSheet(item){
  editId = item ? item.id : null;
  document.getElementById('sheetTitle').textContent = item ? 'แก้ไขรายการ' : 'เพิ่มรายการ';
  document.getElementById('fName').value = item?.name || '';
  document.getElementById('fGroup').value = item?.group || '';
  document.getElementById('fAmount').value = item?.amount || '';
  document.getElementById('fCurrent').value = item?.current || '';
  document.getElementById('fTotal').value = item?.total || '';
  document.getElementById('fNote').value = item?.note || '';
  document.getElementById('btnDel').style.display = item ? 'block' : 'none';
  setTimeout(refreshGroupList, 0);
  document.getElementById('sheetBg').classList.add('open');
}
function closeSheet(){ document.getElementById('sheetBg').classList.remove('open'); }

document.getElementById('btnAdd').onclick = ()=>openSheet(null);
document.getElementById('btnBackup').onclick = ()=>{
  document.getElementById('backupTa').value = JSON.stringify(items, null, 2);
  document.getElementById('backupBg').classList.add('open');
};
document.getElementById('backupBg').onclick = e=>{ if(e.target.id==='backupBg') document.getElementById('backupBg').classList.remove('open'); };
document.getElementById('btnCopyBackup').onclick = async ()=>{
  const ta = document.getElementById('backupTa');
  ta.select();
  try{ await navigator.clipboard.writeText(ta.value); toast('คัดลอกแล้ว ✅ เก็บข้อความนี้ไว้ที่ปลอดภัย'); }
  catch(e){ toast('คัดลอกอัตโนมัติไม่ได้ ลองกดเลือกข้อความแล้วคัดลอกเอง'); }
};
document.getElementById('btnRestoreBackup').onclick = ()=>{
  try{
    const parsed = JSON.parse(document.getElementById('backupTa').value);
    if(!Array.isArray(parsed)) throw new Error('bad');
    if(!confirm('กู้คืนข้อมูลนี้ทับของเดิมทั้งหมดเลยไหม?')) return;
    items = parsed; save(); render();
    document.getElementById('backupBg').classList.remove('open');
    toast('กู้คืนข้อมูลเรียบร้อย ✅');
  }catch(e){ toast('ข้อความไม่ถูกต้อง กู้คืนไม่ได้'); }
};
document.getElementById('sheetBg').onclick = e=>{ if(e.target.id==='sheetBg') closeSheet(); };

document.getElementById('btnSave').onclick = ()=>{
  const name = document.getElementById('fName').value.trim();
  if(!name){ document.getElementById('fName').focus(); return; }
  const data = {
    name,
    group: document.getElementById('fGroup').value.trim(),
    amount: parseFloat(document.getElementById('fAmount').value)||0,
    current: document.getElementById('fCurrent').value ? parseInt(document.getElementById('fCurrent').value) : null,
    total: document.getElementById('fTotal').value ? parseInt(document.getElementById('fTotal').value) : null,
    note: document.getElementById('fNote').value.trim(),
  };
  if(editId){
    const it = items.find(i=>i.id===editId);
    Object.assign(it, data);
  } else {
    items.push({ id: 'i'+Date.now(), paid:false, ...data });
  }
  save(); render(); closeSheet();
};
document.getElementById('btnDel').onclick = ()=>{
  if(confirm('ลบรายการนี้เลยไหม?')){ items = items.filter(i=>i.id!==editId); save(); render(); closeSheet(); }
};

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

document.getElementById('btnClose').onclick = ()=>{
  const unpaidCount = items.filter(i=>!i.paid).length;
  const msg = unpaidCount>0
    ? `ยังมี ${unpaidCount} รายการที่ยังไม่ได้จ่าย จะปิดรอบเดือนนี้เลยไหม? (รายการที่จ่ายแล้วจะรีเซ็ตให้เดือนหน้า)`
    : 'ปิดรอบเดือนนี้ และรีเซ็ตให้พร้อมสำหรับเดือนหน้าเลยไหม?';
  if(!confirm(msg)) return;
  const finished = [];
  items = items.filter(i=>{
    if(!i.paid) return true;
    if(i.total){
      i.current = (i.current||0) + 1;
      if(i.current > i.total){ finished.push(i.name); return false; }
    }
    i.paid = false;
    return true;
  });
  save(); render();
  toast(finished.length ? `ปิดรอบเรียบร้อย ✅ ผ่อนครบแล้ว: ${finished.join(', ')}` : 'ปิดรอบเดือนนี้เรียบร้อย ✅');
};

render();
</script>
</body>
</html>
