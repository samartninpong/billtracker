<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดบัญชีบิล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF9; --ink:#16181C; --ink-soft:#84898F;
    --accent:#3D6AF2; --accent-soft:#EEF2FE; --line:#EAEAE8;
    --paid:#1F9D6C; --paid-soft:#E7F6EF; --card-bg:#FFFFFF; --shadow:rgba(20,20,25,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111214; --ink:#EDEEEF; --ink-soft:#8B8F94;
      --accent:#7C9CFF; --accent-soft:#1B2036; --line:#25272A;
      --paid:#3FCB93; --paid-soft:#122820; --card-bg:#1A1B1E; --shadow:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#111214; --ink:#EDEEEF; --ink-soft:#8B8F94;
    --accent:#7C9CFF; --accent-soft:#1B2036; --line:#25272A;
    --paid:#3FCB93; --paid-soft:#122820; --card-bg:#1A1B1E; --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 100px;}
  .cover{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;padding:22px 20px;
    box-shadow:0 6px 20px var(--shadow);}
  .cover .month{font-weight:600;font-size:14px;color:var(--ink-soft);}
  .cover .total{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;
    margin-top:6px;line-height:1.05;letter-spacing:-.01em;}
  .cover .totallabel{font-size:13px;color:var(--ink-soft);margin-top:5px;}
  .cover .stats{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}
  .cover .stats b{font-family:'IBM Plex Mono',monospace;font-size:15px;display:block;color:var(--ink);font-weight:600;margin-top:2px;}
  .actions{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;border:none;border-radius:11px;padding:13px;font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.96);opacity:.85;}
  .btn-add{background:var(--accent);color:#fff;}
  .btn-close{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .group{margin-top:22px;}
  .group h2{font-size:14px;font-weight:600;color:var(--ink-soft);
    display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;}
  .group h2 span{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);}
  .card{background:var(--card-bg);border-radius:14px;border:1px solid var(--line);overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);
    transition:background-color .2s ease;}
  .row:last-child{border-bottom:none;}
  .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
    flex:none;cursor:pointer;position:relative;background:none;padding:0;
    transition:background-color .18s ease, border-color .18s ease, transform .18s ease;}
  .chk:active{transform:scale(.85);}
  .chk.on{background:var(--paid);border-color:var(--paid);}
  .chk.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:13px;}
  .rowmain{flex:1;min-width:0;transition:opacity .2s ease;}
  .row.ispaid .rowmain{opacity:.5;}
  .rowmain .name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);
    background:var(--accent-soft);padding:1px 7px;border-radius:20px;flex:none;}
  .rowmain .note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .amount{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
    text-align:right;flex:none;transition:opacity .2s ease;}
  .row.ispaid .amount{opacity:.5;}
  .edit{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;
    padding:4px 2px;flex:none;transition:opacity .15s ease;}
  .edit:active{opacity:.5;}
  .empty{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:14px;line-height:1.7;}
  .sheet-bg{position:fixed;inset:0;background:rgba(15,15,17,.4);display:flex;
    align-items:flex-end;z-index:10;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .25s ease, visibility 0s linear .25s;}
  .sheet-bg.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease;}
  .sheet{background:var(--paper);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
  .sheet-bg.open .sheet{transform:translateY(0);}
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .sheet h3 button{background:none;border:none;color:var(--ink-soft);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1;}
  .field{margin-bottom:12px;}
  .field label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
    background:var(--card-bg);color:var(--ink);font-family:inherit;font-size:16px;
    transition:border-color .15s ease;}
  .field input:focus{outline:none;border-color:var(--accent);}
  .field.split{display:flex;gap:10px;}
  .field.split > div{flex:1;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px;}
  .chip{border:none;background:var(--accent-soft);color:var(--accent);font-family:inherit;
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;
    transition:transform .12s ease;}
  .chip:active{transform:scale(.94);}
  .chip.active{background:var(--accent);color:#fff;}
  .linkrow{display:flex;justify-content:center;gap:18px;margin-top:14px;}
  .linkbtn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;
